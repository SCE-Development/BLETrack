<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLETrack Device Manager</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #273548;
      --text: #e5e7eb;
      --muted: #a6adbb;
      --accent: #334d7a;
      --accent-strong: #243a63;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 5% 0%, #223048 0%, rgba(34, 48, 72, 0) 36%),
        radial-gradient(circle at 100% 0%, #1f2d43 0%, rgba(31, 45, 67, 0) 34%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 36px; }
    h1 { margin: 0 0 8px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 8px 18px rgba(24, 39, 66, 0.09);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .status strong { color: #f3f4f6; }
    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      padding: 16px;
      box-shadow: 0 10px 26px rgba(24, 39, 66, 0.11);
    }
    .card h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: #f3f4f6; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    button:hover { border-color: #4b5563; background: #334155; }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #1b2533;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      word-break: break-word;
    }
    tbody tr:hover { background: #253347; }
    th { color: #cbd5e1; font-weight: 600; background: #223043; }
    .form {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    .form input, .form select {
      width: 100%;
      border: 1px solid var(--border);
      background: #1a2433;
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
    }
    .full { grid-column: 1 / -1; }
    .msg { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
    .stack { display: grid; gap: 16px; }
    .inline-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      align-items: end;
    }
    .inline-form label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    .inline-form input, .inline-form select {
      width: 100%;
      border: 1px solid var(--border);
      background: #1a2433;
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
    }
    .inline-form input:focus, .inline-form select:focus, .form input:focus, .form select:focus {
      outline: none;
      border-color: #5e7aa8;
      box-shadow: 0 0 0 3px rgba(51, 77, 122, 0.24);
    }
    .mono {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #111827;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    @media (max-width: 960px) {
      .wrap { padding: 20px 14px 24px; }
      h1 { font-size: 28px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .inline-form { grid-template-columns: 1fr; }
      .toolbar button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BLETrack Device Manager</h1>
    <p>Pair known devices, auto-apply filters, and monitor live status.</p>

    <div class="status" id="health"></div>

    <div class="grid">
      <section class="card stack">
        <div>
          <h2>Enrollment</h2>
          <div class="inline-form">
            <label>
              Device Type
              <select id="enroll-device-type">
                <option value="phone">phone</option>
                <option value="watch">watch</option>
                <option value="tablet">tablet</option>
                <option value="other">other</option>
              </select>
            </label>
            <label>
              Enroll Name
              <input id="enroll-name" placeholder="andrew_iphone" value="new_device" />
            </label>
            <button class="primary" onclick="startEnroll()">Start Enroll</button>
            <button onclick="cancelEnroll()">Cancel Enroll</button>
          </div>
          <div class="msg" id="enroll-msg"></div>
        </div>

        <div>
          <h2>Finalize Pairing</h2>
          <div class="inline-form">
            <label>
              Public Name
              <input id="pair-public-name" placeholder="Andrew iPhone" />
            </label>
            <label>
              Device Type
              <select id="pair-device-type">
                <option value="phone">phone</option>
                <option value="watch">watch</option>
                <option value="tablet">tablet</option>
                <option value="other">other</option>
              </select>
            </label>
            <label>
              Fingerprint ID
              <select id="pair-fingerprint"></select>
            </label>
            <label>
              Or Live Device ID
              <select id="pair-observed"></select>
            </label>
            <button class="primary" onclick="finalizePairing()">Pair Device</button>
          </div>
          <div class="toolbar">
            <button onclick="loadFingerprintOptions()">Refresh Fingerprints</button>
            <button onclick="loadObservedOptions()">Refresh Live IDs</button>
          </div>
          <div class="msg" id="pair-msg"></div>
        </div>
      </section>

      <section class="card">
        <h2>Paired Devices</h2>
        <div class="toolbar">
          <button onclick="loadPairedDevices()">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Public Name</th>
              <th>Fingerprint ID</th>
              <th>Type</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="paired-body"></tbody>
        </table>
        <div class="msg" id="paired-msg"></div>
      </section>

      <section class="card">
        <h2>Current Detected Devices</h2>
        <div class="toolbar">
          <button onclick="loadCurrentDetected()">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Public Name</th>
              <th>Live Name</th>
              <th>Room</th>
              <th>Distance</th>
              <th>Last Seen</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="current-body"></tbody>
        </table>
        <div class="msg" id="current-msg"></div>
      </section>
    </div>
  </div>

  <script>
    async function getJSON(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    function safe(v) {
      return (v === null || v === undefined || v === '') ? '-' : String(v);
    }

    function fmtTs(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return ts;
      return d.toLocaleString();
    }

    function setMessage(id, text, cls) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `msg ${cls || ''}`.trim();
    }

    async function loadHealth() {
      try {
        const data = await getJSON('/health');
        const ing = data.mqtt_ingester || {};
        document.getElementById('health').innerHTML = `
          <span>DB: <strong>${data.database_ok ? 'ok' : 'down'}</strong></span>
          <span>MQTT: <strong>${ing.connected ? 'connected' : 'disconnected'}</strong></span>
          <span>Processed: <strong>${safe(ing.processed_count)}</strong></span>
          <span>Failed: <strong>${safe(ing.failed_count)}</strong></span>
        `;
      } catch (err) {
        document.getElementById('health').innerHTML = `
          <span style="color: var(--err);">API unreachable: ${safe(err.message)}</span>
          <span>Open this UI from the API server URL (example: http://127.0.0.1:5055/)</span>
        `;
      }
    }

    async function startEnroll() {
      const deviceType = document.getElementById('enroll-device-type').value.trim();
      const name = document.getElementById('enroll-name').value.trim() || 'new_device';
      setMessage('enroll-msg', 'Starting enrollment...', '');
      try {
        const params = new URLSearchParams({ device_type: deviceType, name });
        const data = await getJSON(`/enroll/start?${params.toString()}`);
        if (data.ok === false) {
          setMessage('enroll-msg', `Enroll start failed: ${safe(data.message || 'unknown error')}`, 'err');
          return;
        }
        setMessage('enroll-msg', 'Enrollment started. Pair on your phone/iPad, then click Refresh Fingerprints and Pair Device.', 'ok');
      } catch (err) {
        setMessage('enroll-msg', `Enroll start failed: ${err.message}`, 'err');
      }
    }

    async function cancelEnroll() {
      setMessage('enroll-msg', 'Canceling enrollment...', '');
      try {
        const data = await getJSON('/enroll/cancel');
        if (data.ok === false) {
          setMessage('enroll-msg', `Enroll cancel failed: ${safe(data.message || 'unknown error')}`, 'err');
          return;
        }
        setMessage('enroll-msg', 'Enrollment canceled.', 'ok');
      } catch (err) {
        setMessage('enroll-msg', `Enroll cancel failed: ${err.message}`, 'err');
      }
    }

    async function loadFingerprintOptions() {
      const select = document.getElementById('pair-fingerprint');
      select.innerHTML = '';
      try {
        const [fingerprintsResp, managedResp] = await Promise.all([
          getJSON('/debug/fingerprints?limit=500'),
          getJSON('/devices/managed?limit=500')
        ]);

        const fingerprints = Array.isArray(fingerprintsResp.data) ? fingerprintsResp.data : [];
        const managed = Array.isArray(managedResp.data) ? managedResp.data : [];
        const activeIds = new Set(
          managed
            .filter((r) => r.is_active && r.fingerprint_device_id)
            .map((r) => String(r.fingerprint_device_id))
        );

        const available = fingerprints
          .map((r) => String(r.device_id || '').trim())
          .filter((id) => id && !activeIds.has(id));

        if (available.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'No unpaired fingerprints found (use Live Device ID)';
          select.appendChild(option);
          setMessage('pair-msg', 'No unpaired fingerprint IDs available. You can pair using Live Device ID.', '');
          return;
        }

        available.sort((a, b) => a.localeCompare(b));
        for (const id of available) {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = id;
          select.appendChild(option);
        }
        setMessage('pair-msg', `Loaded ${available.length} unpaired fingerprint ID(s).`, '');
      } catch (err) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Failed to load fingerprints';
        select.appendChild(option);
        setMessage('pair-msg', `Failed to load fingerprints: ${err.message}`, 'err');
      }
    }

    async function loadObservedOptions() {
      const select = document.getElementById('pair-observed');
      select.innerHTML = '';
      try {
        const data = await getJSON('/pair/candidates?limit=500');
        const rows = Array.isArray(data.data) ? data.data : [];

        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = rows.length ? 'Select live device ID' : 'No unpaired live IDs found';
        select.appendChild(empty);

        for (const row of rows) {
          const option = document.createElement('option');
          option.value = String(row.observed_device_id || '').trim();
          const liveName = row.live_name ? ` (${row.live_name})` : '';
          option.textContent = `${row.observed_device_id}${liveName}`;
          select.appendChild(option);
        }
      } catch (err) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Failed to load live IDs';
        select.appendChild(option);
      }
    }

    async function finalizePairing() {
      const publicName = document.getElementById('pair-public-name').value.trim();
      const deviceType = document.getElementById('pair-device-type').value.trim();
      const fingerprintId = document.getElementById('pair-fingerprint').value.trim();
      const observedId = document.getElementById('pair-observed').value.trim();

      if (!publicName) {
        setMessage('pair-msg', 'Public Name is required.', 'err');
        return;
      }
      if (!fingerprintId && !observedId) {
        setMessage('pair-msg', 'Select a Fingerprint ID or Live Device ID.', 'err');
        return;
      }

      setMessage('pair-msg', 'Pairing device and updating filter...', '');
      try {
        const res = await fetch('/pair/finalize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            public_name: publicName,
            device_type: deviceType,
            fingerprint_device_id: fingerprintId || null,
            observed_device_id: observedId || null
          })
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          setMessage('pair-msg', `Pair failed: ${safe(data.message || data.error || res.statusText)}`, 'err');
          return;
        }

        setMessage('pair-msg', 'Device paired and include filter updated.', 'ok');
        document.getElementById('pair-public-name').value = '';
        await Promise.all([loadFingerprintOptions(), loadObservedOptions(), loadPairedDevices(), loadCurrentDetected()]);
      } catch (err) {
        setMessage('pair-msg', `Pair failed: ${err.message}`, 'err');
      }
    }

    async function removePairedDevice(publicName) {
      setMessage('paired-msg', `Removing ${publicName}...`, '');
      try {
        const res = await fetch('/pair/remove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ public_name: publicName })
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          setMessage('paired-msg', `Remove failed: ${safe(data.message || data.error || res.statusText)}`, 'err');
          return;
        }

        setMessage('paired-msg', `Removed ${publicName} and refreshed include filter.`, 'ok');
        await Promise.all([loadFingerprintOptions(), loadObservedOptions(), loadPairedDevices(), loadCurrentDetected()]);
      } catch (err) {
        setMessage('paired-msg', `Remove failed: ${err.message}`, 'err');
      }
    }

    async function loadPairedDevices() {
      const body = document.getElementById('paired-body');
      const msg = document.getElementById('paired-msg');
      body.innerHTML = '';
      msg.textContent = '';
      msg.className = 'msg';

      try {
        const data = await getJSON('/dashboard/current?limit=500');
        const rows = Array.isArray(data.data) ? data.data : [];

        if (rows.length === 0) {
          msg.textContent = 'No paired devices yet.';
          return;
        }

        for (const row of rows) {
          const tr = document.createElement('tr');
          const nameEscaped = String(row.public_name || '').replace(/'/g, "\\'");
          const isOnline = Boolean(row.is_online);
          tr.innerHTML = `
            <td>${safe(row.public_name)}</td>
            <td>${safe(row.fingerprint_device_id || row.observed_device_id)}</td>
            <td>${safe(row.device_type)}</td>
            <td>${isOnline ? 'online' : 'offline'}</td>
            <td><button onclick="removePairedDevice('${nameEscaped}')">Remove</button></td>
          `;
          body.appendChild(tr);
        }
        msg.textContent = `Showing ${rows.length} paired device(s).`;
      } catch (err) {
        msg.textContent = `Failed to load paired devices: ${err.message}`;
        msg.className = 'msg err';
      }
    }

    async function loadCurrentDetected() {
      const body = document.getElementById('current-body');
      const msg = document.getElementById('current-msg');
      body.innerHTML = '';
      msg.textContent = '';
      msg.className = 'msg';

      try {
        const data = await getJSON('/dashboard/current?limit=500');
        const rows = Array.isArray(data.data) ? data.data : [];

        if (rows.length === 0) {
          msg.textContent = 'No paired devices configured yet.';
          return;
        }

        let onlineCount = 0;
        for (const row of rows) {
          if (row.is_online) onlineCount += 1;
          const tr = document.createElement('tr');
          const statusText = row.status || (row.is_online ? 'online' : 'offline');
          tr.innerHTML = `
            <td>${safe(row.public_name)}</td>
            <td>${safe(row.payload_name)}</td>
            <td>${safe(row.room)}</td>
            <td>${row.distance_m != null ? `${row.distance_m.toFixed(2)}m` : '-'}</td>
            <td>${fmtTs(row.last_seen_ts)}</td>
            <td>${safe(statusText)}</td>
          `;
          body.appendChild(tr);
        }
        msg.textContent = `${onlineCount}/${rows.length} currently online.`;
      } catch (err) {
        msg.textContent = `Failed to load current detected devices: ${err.message}`;
        msg.className = 'msg err';
      }
    }

    async function bootstrap() {
      try {
        await Promise.all([
          loadHealth(),
          loadFingerprintOptions(),
          loadObservedOptions(),
          loadPairedDevices(),
          loadCurrentDetected()
        ]);
      } catch (err) {
        console.error(err);
      }
    }

    bootstrap();
    setInterval(loadHealth, 3000);
    setInterval(loadCurrentDetected, 5000);
  </script>
</body>
</html>
