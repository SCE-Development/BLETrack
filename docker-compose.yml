services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bletrack-api
    restart: always
    working_dir: /app
    command: uvicorn api.server:app --host 0.0.0.0 --port 5055
    env_file:
      - .env
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://${POSTGRES_USER:-bletrack}:${POSTGRES_PASSWORD:-bletrack_dev_password}@timescaledb:5432/${POSTGRES_DB:-bletrack}
    volumes:
      - ./:/app
    ports:
      - "5055:5055"
    depends_on:
      - mosquitto
      - timescaledb
    networks:
      - ble_net

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"   # MQTT Port
      - "9001:9001"   # Websocket Port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - ble_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bletrack-timescaledb
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bletrack}
      POSTGRES_USER: ${POSTGRES_USER:-bletrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bletrack_dev_password}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init/timescaledb-init.sql:/docker-entrypoint-initdb.d/001-timescaledb-init.sql:ro
    networks:
      - ble_net

networks:
  ble_net:
    driver: bridge

volumes:
  timescaledb_data:
