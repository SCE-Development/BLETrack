services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bletrack-api
    restart: always
    working_dir: /app
    env_file:
      - .env
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://${POSTGRES_USER:-bletrack}:${POSTGRES_PASSWORD:-bletrack_dev_password}@timescaledb:5432/${POSTGRES_DB:-bletrack}
    volumes:
      - ~/.ssh/id_ed25519-tunnel.pub:/app/ssh_key.pub
      - ~/.ssh/id_ed25519-tunnel:/app/ssh_key
      - ~/.ssh/known_hosts:/app/known_hosts
      - ./config:/app/config
      - ./api:/app/api
    ports:
      - "5055:5055"
    # depends_on:
    #   mosquitto:
    #     condition: service_started
    #   timescaledb:
    #     condition: service_healthy
    # healthcheck:
    #   test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5055/health')\""]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s
    networks:
      - ble_net

  # tunnel:
  #   build:
  #     context: ./tunnel
  #     dockerfile: Dockerfile
  #   container_name: bletrack-tunnel
  #   restart: always
  #   environment:
  #     CORE_V4_IP: ${CORE_V4_IP}
  #   volumes:
  #   tty: true
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   networks:
  #     - ble_net

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"   # MQTT Port
      - "9001:9001"   # Websocket Port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - ble_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: bletrack-timescaledb
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bletrack}
      POSTGRES_USER: ${POSTGRES_USER:-bletrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bletrack_dev_password}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init/timescaledb-init.sql:/docker-entrypoint-initdb.d/001-timescaledb-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bletrack} -d ${POSTGRES_DB:-bletrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ble_net

networks:
  ble_net:
    driver: bridge

volumes:
  timescaledb_data:
